# Generate the Xcode project with: xcodegen generate
# Pass your own team and bundle id at build time (see README).
name: FMSmishingProbe
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "27.0"
settings:
  base:
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  FMSmishingProbe:
    type: application
    platform: iOS
    sources:
      - path: ProbeApp.swift
      - path: ../swift/Pipeline.swift
      - path: ../swift/DetectionEngine.swift
      - path: ../data/es_curated.jsonl
        buildPhase: resources
      - path: ../data/es_adversarial.jsonl
        buildPhase: resources
      - path: ../data/es_adversarial_v2.jsonl
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.fmsmishingprobe
